<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Factory Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cover:#163A2E;
    --cover-dark:#0D2820;
    --paper:#F3EFE1;
    --paper-2:#ECE6D2;
    --rule-red:#C24B4B;
    --rule-blue:#8FA0C2;
    --ink:#1C2B3A;
    --ink-soft:#5B6B7A;
    --gold:#AD812F;
    --gold-soft:#DCC98C;
    --debit:#9C3B3B;
    --credit:#2F6B4F;
    --font-display:'IBM Plex Serif',serif;
    --font-body:'IBM Plex Sans',sans-serif;
    --font-mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:transparent;color:var(--ink);font-family:var(--font-body);}
  .app{display:flex;flex-direction:column;min-height:100%;background:var(--paper);border:1px solid #d8d0b8;border-radius:6px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08);}

  /* ===== Header / cover strip ===== */
  .cover{background:linear-gradient(135deg,var(--cover),var(--cover-dark));color:var(--paper);padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px;}
  .cover-title{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
  .cover-title input{background:transparent;border:none;border-bottom:1px dashed rgba(243,239,225,.4);color:var(--paper);font-family:var(--font-display);font-weight:700;font-size:20px;padding:2px 0;min-width:120px;}
  .cover-title input:focus{outline:none;border-bottom-color:var(--gold-soft);}
  .cover-sub{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-soft);font-family:var(--font-mono);}
  .cover-actions{display:flex;gap:8px;align-items:center;}
  .icon-btn{background:rgba(243,239,225,.08);border:1px solid rgba(243,239,225,.25);color:var(--paper);border-radius:5px;padding:6px 10px;font-size:12px;cursor:pointer;font-family:var(--font-body);}
  .icon-btn:hover{background:rgba(243,239,225,.18);}

  /* ===== Tabs styled as ledger index tabs ===== */
  .tabs{display:flex;gap:6px;padding:10px 16px 0;background:var(--paper-2);border-bottom:2px solid var(--cover);}
  .tab{
    font-family:var(--font-body);font-weight:600;font-size:13px;color:var(--ink-soft);
    background:#E4DDC3;border:1px solid #cfc6a4;border-bottom:none;
    padding:9px 16px 8px;cursor:pointer;
    clip-path:polygon(8% 0,92% 0,100% 100%,0% 100%);
    margin-bottom:-2px;transition:all .12s ease;
  }
  .tab:hover{background:#EFE9D4;color:var(--ink);}
  .tab.active{background:var(--paper);color:var(--cover);border-color:var(--cover);position:relative;z-index:2;}

  /* ===== Page / content area ===== */
  .page{padding:20px 22px 28px;flex:1;}
  h2.section-title{font-family:var(--font-display);font-size:17px;margin:0 0 14px;color:var(--cover);display:flex;align-items:center;gap:8px;}
  h2.section-title::before{content:"";width:5px;height:16px;background:var(--gold);display:inline-block;border-radius:1px;}

  /* ===== Dashboard cards ===== */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px;}
  .card{background:var(--paper);border:1px solid #d8d0b8;border-left:4px solid var(--gold);border-radius:4px;padding:12px 14px;}
  .card .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-soft);font-family:var(--font-mono);}
  .card .val{font-family:var(--font-mono);font-size:22px;font-weight:600;margin-top:4px;color:var(--ink);}
  .card.receivable{border-left-color:var(--debit);}
  .card.payable{border-left-color:var(--credit);}

  .recent-list{border:1px solid #d8d0b8;border-radius:4px;overflow:hidden;}
  .recent-row{display:flex;justify-content:space-between;padding:9px 12px;font-size:13px;border-bottom:1px solid #e3ddc6;background:var(--paper);}
  .recent-row:last-child{border-bottom:none;}
  .recent-row .rtype{font-family:var(--font-mono);font-size:10px;padding:2px 6px;border-radius:3px;text-transform:uppercase;letter-spacing:.05em;}
  .rtype.sale{background:#f3dede;color:var(--debit);}
  .rtype.purchase{background:#ded9f3;color:#4b3b9c;}
  .rtype.receipt{background:#dcefe4;color:var(--credit);}
  .rtype.payment{background:#f3ecd9;color:var(--gold);}
  .empty-note{color:var(--ink-soft);font-size:13px;padding:14px;text-align:center;border:1px dashed #cfc6a4;border-radius:4px;}

  /* ===== Forms ===== */
  .form-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px;}
  .field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:140px;}
  .field label{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-soft);font-family:var(--font-mono);}
  input[type=text],input[type=date],input[type=number],select,textarea{
    font-family:var(--font-body);font-size:13.5px;padding:8px 9px;border:1px solid #c8bf9e;border-radius:4px;background:#fdfcf6;color:var(--ink);
  }
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--cover);box-shadow:0 0 0 2px rgba(22,58,46,.12);}
  .btn{font-family:var(--font-body);font-weight:600;font-size:13px;padding:9px 16px;border-radius:4px;border:1px solid var(--cover);background:var(--cover);color:var(--paper);cursor:pointer;}
  .btn:hover{background:var(--cover-dark);}
  .btn.secondary{background:transparent;color:var(--cover);}
  .btn.secondary:hover{background:rgba(22,58,46,.08);}
  .btn.danger{background:transparent;border-color:var(--debit);color:var(--debit);}
  .btn.danger:hover{background:rgba(156,59,59,.08);}
  .btn.small{padding:5px 10px;font-size:11.5px;}

  .type-picker{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
  .type-opt{padding:8px 14px;border:1px solid #c8bf9e;border-radius:5px;font-size:13px;font-weight:600;cursor:pointer;background:#fdfcf6;color:var(--ink-soft);}
  .type-opt.active.sale{background:#f3dede;border-color:var(--debit);color:var(--debit);}
  .type-opt.active.purchase{background:#ded9f3;border-color:#4b3b9c;color:#4b3b9c;}
  .type-opt.active.receipt{background:#dcefe4;border-color:var(--credit);color:var(--credit);}
  .type-opt.active.payment{background:#f3ecd9;border-color:var(--gold);color:var(--gold);}

  .items-table{width:100%;border-collapse:collapse;margin-bottom:10px;}
  .items-table th{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);text-align:left;padding:6px 6px;border-bottom:2px solid var(--cover);}
  .items-table td{padding:5px 6px;border-bottom:1px solid #e3ddc6;}
  .items-table input{width:100%;padding:6px 7px;font-size:13px;}
  .items-table .amt-cell{font-family:var(--font-mono);text-align:right;padding-right:10px;white-space:nowrap;}
  .items-table .rm-cell{text-align:center;}
  .product-combo{position:relative;}
  .product-combo input.item-product{padding-right:26px;}
  .product-drop-btn{position:absolute;right:2px;top:2px;bottom:2px;width:24px;border:none;background:transparent;color:var(--ink-soft);cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;border-radius:3px;}
  .product-drop-btn:hover{background:rgba(22,58,46,.08);color:var(--cover);}
  .product-dropdown{display:none;position:absolute;top:100%;left:0;right:0;z-index:30;background:#fdfcf6;border:1px solid var(--cover);border-top:none;border-radius:0 0 4px 4px;box-shadow:0 6px 14px rgba(0,0,0,.14);max-height:190px;overflow-y:auto;}
  .product-dropdown.open{display:block;}
  .product-opt{padding:7px 9px;font-size:13px;cursor:pointer;border-bottom:1px solid #ece6cf;color:var(--ink);}
  .product-opt:last-child{border-bottom:none;}
  .product-opt:hover,.product-opt.active{background:var(--gold-soft);color:var(--cover-dark);font-weight:600;}

  .totals-box{margin-left:auto;width:280px;font-family:var(--font-mono);font-size:13px;border:1px solid #d8d0b8;border-radius:4px;overflow:hidden;}
  .totals-box .trow{display:flex;justify-content:space-between;padding:7px 12px;border-bottom:1px solid #e3ddc6;background:var(--paper);}
  .totals-box .trow.total{background:var(--cover);color:var(--paper);font-weight:700;border-bottom:none;}

  /* ===== Ledger table (the signature ruled page) ===== */
  .ledger-wrap{border:1px solid #c8bf9e;border-radius:4px;overflow:hidden;background:#fffdf6;position:relative;}
  .ledger-wrap::before{content:"";position:absolute;top:0;bottom:0;left:38px;width:1px;background:var(--rule-red);opacity:.55;pointer-events:none;}
  table.ledger{width:100%;border-collapse:collapse;font-size:12.5px;}
  table.ledger thead th{background:var(--cover);color:var(--paper);font-family:var(--font-mono);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;padding:8px 8px;text-align:left;position:sticky;top:0;}
  table.ledger td{padding:6px 8px;border-bottom:1px solid var(--rule-blue);vertical-align:top;}
  table.ledger tr.entry-head td{border-top:1px solid #b9a97a;padding-top:8px;}
  table.ledger td.num{font-family:var(--font-mono);text-align:right;white-space:nowrap;}
  table.ledger td.debit-col{color:var(--debit);}
  table.ledger td.credit-col{color:var(--credit);}
  table.ledger td.bal-col{font-weight:700;}
  table.ledger .item-line{color:var(--ink-soft);font-size:12px;}
  table.ledger .particulars-title{font-weight:700;color:var(--ink);}
  table.ledger tr.total-row td{border-top:2px solid var(--cover);font-weight:700;background:var(--paper-2);}
  table.ledger tr.total-row.closing td{border-top:none;background:var(--gold-soft);color:var(--cover-dark);}
  .del-x{cursor:pointer;color:var(--debit);font-family:var(--font-mono);font-size:11px;border:1px solid var(--debit);border-radius:3px;padding:1px 5px;background:transparent;}

  .party-select-row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:16px;}

  .party-list{display:flex;flex-direction:column;gap:8px;}
  .party-card{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border:1px solid #d8d0b8;border-radius:5px;background:var(--paper);cursor:pointer;}
  .party-card:hover{border-color:var(--gold);}
  .party-card .pname{font-weight:600;font-size:14px;}
  .party-card .ptype{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;color:var(--ink-soft);letter-spacing:.05em;margin-left:8px;}
  .party-card .pbal{font-family:var(--font-mono);font-weight:700;}
  .party-card .pbal.pos{color:var(--debit);}
  .party-card .pbal.neg{color:var(--credit);}
  .party-card .pactions{display:flex;gap:6px;}

  .settings-panel{position:fixed;top:0;right:0;bottom:0;width:320px;background:var(--paper);border-left:2px solid var(--cover);box-shadow:-6px 0 20px rgba(0,0,0,.15);padding:20px;overflow-y:auto;z-index:50;}
  .settings-panel h3{font-family:var(--font-display);color:var(--cover);margin-top:0;}
  .settings-close{position:absolute;top:14px;right:16px;cursor:pointer;font-size:18px;color:var(--ink-soft);background:none;border:none;}
  .overlay{position:fixed;inset:0;background:rgba(13,40,32,.35);z-index:40;}

  .add-row-link{font-size:12.5px;color:var(--cover);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:4px;margin-bottom:14px;}
  .add-row-link:hover{text-decoration:underline;}

  ::placeholder{color:#a79f83;}
  .foot-note{font-size:11px;color:var(--ink-soft);margin-top:14px;text-align:center;font-family:var(--font-mono);}

  @media print{
    body *{ visibility:hidden; }
    .print-preview-paper, .print-preview-paper *{ visibility:visible; }
    .print-preview-paper{ position:absolute; top:0; left:0; width:100%; box-shadow:none; border:none; padding:0; }
    /* Neutralise the overlay wrapper so it doesn't add a coloured background or
       fixed positioning that shifts/clips the printable paper */
    .print-overlay{ position:static !important; background:none !important; padding:0 !important; z-index:auto !important; overflow:visible !important; }
    /* Hide only the toolbar, not the whole overlay */
    .print-preview-toolbar{ display:none !important; }
    .no-print{ display:none !important; }
  }
  .print-overlay{position:fixed;inset:0;background:rgba(13,40,32,.55);z-index:60;overflow:auto;padding:30px 16px;}
  .print-preview-paper{max-width:820px;margin:0 auto;background:#fffdf6;border:1px solid #c8bf9e;border-radius:4px;box-shadow:0 8px 30px rgba(0,0,0,.25);padding:28px 30px;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .print-preview-toolbar{max-width:820px;margin:0 auto 14px;display:flex;justify-content:flex-end;gap:8px;}
  .print-header{margin-bottom:18px;padding-bottom:14px;border-bottom:2px solid var(--cover);}
  .print-header .pcompany{font-family:var(--font-display);font-size:22px;font-weight:700;color:var(--cover);}
  .print-header .pmeta{font-size:12px;color:var(--ink-soft);margin-top:3px;}
  .print-header .ptitle{margin-top:12px;font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--gold);}
  .print-header .pparty{font-family:var(--font-display);font-size:16px;color:var(--ink);margin-top:2px;}
  .print-preview-toolbar label{display:flex;align-items:center;gap:6px;color:#fff;font-size:13px;font-family:var(--font-body);margin-right:auto;background:rgba(0,0,0,.25);padding:6px 12px;border-radius:5px;}

  /* Black & white friendly print mode: no reliance on color or background fill */
  .print-preview-paper.bw-mode{ background:#fff; }
  .print-preview-paper.bw-mode .ledger-wrap::before{ display:none; }
  .print-preview-paper.bw-mode .print-header{ border-bottom:2px solid #000; }
  .print-preview-paper.bw-mode .pcompany,
  .print-preview-paper.bw-mode .pparty{ color:#000; }
  .print-preview-paper.bw-mode .ptitle{ color:#000; font-weight:700; }
  .print-preview-paper.bw-mode table.ledger thead th{ background:#fff; color:#000; border-bottom:2px solid #000; }
  .print-preview-paper.bw-mode table.ledger td{ border-bottom:1px solid #999; }
  .print-preview-paper.bw-mode td.debit-col,
  .print-preview-paper.bw-mode td.credit-col,
  .print-preview-paper.bw-mode td.bal-col{ color:#000; }
  .print-preview-paper.bw-mode tr.entry-head td{ border-top:1px solid #000; }
  .print-preview-paper.bw-mode tr.total-row td{ background:#fff; border-top:2px solid #000; color:#000; }
  .print-preview-paper.bw-mode tr.total-row.closing td{ background:#fff; color:#000; border-top:1px solid #000; border-bottom:2px double #000; }
  .print-preview-paper.bw-mode .particulars-title{ color:#000; }
  .print-preview-paper.bw-mode .item-line{ color:#333; }
  @media (max-width:640px){
    .cover{flex-direction:column;align-items:flex-start;}
    .totals-box{width:100%;}
    table.ledger{font-size:11px;}
  }

  /* ===== WhatsApp share button ===== */
  .wa-btn{background:#25D366;border-color:#1ebe5d;color:#fff;display:flex;align-items:center;gap:6px;}
  .wa-btn:hover{background:#1ebe5d;}
  .wa-btn:disabled{opacity:.55;cursor:not-allowed;}

  /* ===== Toast notification ===== */
  #shareToast{
    position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);
    background:rgba(22,58,46,.95);color:var(--paper);font-family:var(--font-body);
    font-size:13px;padding:10px 20px;border-radius:8px;z-index:999;
    opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;white-space:nowrap;
    box-shadow:0 4px 18px rgba(0,0,0,.3);
  }
  #shareToast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ===== WhatsApp fallback modal ===== */
  #waModal{
    position:fixed;inset:0;z-index:9999;background:rgba(13,40,32,.65);
    display:none;align-items:center;justify-content:center;padding:20px;
  }
  #waModal.open{ display:flex; }
  #waModalBox{
    background:var(--paper);border-radius:10px;padding:28px 26px;max-width:380px;width:100%;
    box-shadow:0 12px 40px rgba(0,0,0,.35);font-family:var(--font-body);
    animation:waSlideIn .22s ease;
  }
  @keyframes waSlideIn{ from{transform:translateY(18px);opacity:0} to{transform:none;opacity:1} }
  #waModalBox h3{ margin:0 0 6px;font-family:var(--font-display);color:var(--cover);font-size:17px; }
  #waModalBox p{ margin:0 0 18px;font-size:13.5px;color:var(--ink-soft);line-height:1.55; }
  #waModalBox .wa-filename{
    font-family:var(--font-mono);font-size:12px;background:var(--paper-2);
    border:1px solid #d8d0b8;border-radius:4px;padding:7px 10px;
    margin-bottom:18px;word-break:break-all;color:var(--ink);
  }
  #waModalBox .wa-actions{ display:flex;gap:10px;flex-wrap:wrap; }
  #waOpenWA{ background:#25D366;border:none;color:#fff;font-family:var(--font-body);font-weight:600;font-size:13px;padding:10px 18px;border-radius:6px;cursor:pointer;flex:1; }
  #waOpenWA:hover{ background:#1ebe5d; }
  #waModalClose{ background:transparent;border:1px solid #c8bf9e;color:var(--ink-soft);font-family:var(--font-body);font-size:13px;padding:10px 14px;border-radius:6px;cursor:pointer; }
  #waModalClose:hover{ background:var(--paper-2); }
</style>
</head>
<body>
<!-- PDF generation libs (loaded from CDN; work offline after first cache) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<div id="shareToast"></div>
<!-- WhatsApp fallback modal -->
<div id="waModal">
  <div id="waModalBox">
    <h3>📤 PDF Ready to Share</h3>
    <p id="waModalDesc">The PDF has been saved to your <strong>Downloads</strong> folder. Open WhatsApp and attach it to any chat.</p>
    <div class="wa-filename" id="waModalFilename"></div>
    <div class="wa-actions">
      <button id="waOpenDesktop" style="display:none">Open WhatsApp →</button>
      <button id="waOpenWA">Open WhatsApp Web →</button>
      <button id="waDownloadPdf">⬇️ Download PDF</button>
      <button id="waModalClose">Close</button>
    </div>
    <div id="waModalNote" style="margin-top:12px;font-size:12px;color:var(--ink-soft);display:none;"></div>
  </div>
</div>
<div class="app" id="app">Loading ledger…</div>

<script>
const STORAGE_KEY = 'factory-ledger-data';

// Bump this with each release you hand out, and add an entry to CHANGELOG.
// There's no internet auto-update (this app is fully offline) — this just
// shows a "what's new" note the first time someone opens a newer copy.
const APP_VERSION = '1.3.2';
const CHANGELOG = [
  { version:'1.3.2', notes:[
    'Dashboard now shows Daily (every day) and Monthly Income & Expenses with options to choose date/month and Sales/Purchases or Receipts/Payments'
  ]},
  { version:'1.3.1', notes:[
    'Ledger Report now includes "All Parties (All Transactions)" so you can view, print, and share all transactions for any date range',
    'Added automatic in-app updates via GitHub Releases while keeping all saved data safe'
  ]},
  { version:'1.3.0', notes:[
    'Product field now suggests names you have used before, as you type',
    'Added Agents — assign a sales/purchase agent to any entry, manage them from the Parties tab',
    'Ledger Report now has a "Sales Summary (No Price)" view — party, agent, product and quantity/cases only, with its own print & share'
  ]},
  { version:'1.2.0', notes:[
    'Commission Charges can now be entered as a flat ₹ amount or as a % of the taxable value'
  ]},
  { version:'1.1.0', notes:[
    'Fixed a bug where the Product field could stop responding after saving an entry',
    'Added a company letterhead + on-screen preview before printing',
    'Added a Black & White friendly print mode',
    'Reduced the installer size'
  ]},
  { version:'1.0.0', notes:[
    'Initial release — parties, sales, purchases, receipts, payments, ledger report'
  ]}
];

let state = {
  settings:{ companyName:'My Factory', address:'', gstin:'', cgstRate:2.5, sgstRate:2.5, igstRate:5, counters:{sale:1,purchase:1,receipt:1,payment:1} },
  parties:[],
  agents:[],
  entries:[],
  lastSeenVersion: null
};
let loaded = false;
let currentTab = 'dashboard';
let settingsOpen = false;
let printPreviewOpen = false;
let printBw = false;
let whatsNewOpen = false;
let updateState = { status: '', version: '' };
function updateStatusText(){
  if(updateState.status==='checking') return 'Checking for updates…';
  if(updateState.status==='available') return `Downloading v${updateState.version||''}…`;
  if(updateState.status==='downloaded') return `v${updateState.version||''} ready — restart to apply.`;
  if(updateState.status==='latest') return 'You are on the latest version.';
  if(updateState.status==='offline') return 'Offline or no update found.';
  if(updateState.status==='dev') return 'Updates are active in the installed .exe.';
  return '';
}

// ---- new entry draft state ----
let draft = { type:'sale', partyId:'', agentId:'', date: todayStr(), items:[ blankItem() ], gstType:'intra', cgstRate:2.5, sgstRate:2.5, igstRate:5, packaging:'', commission:'', commissionType:'amount', amount:'', mode:'Cash', note:'', newPartyName:'', newPartyType:'customer', newOpeningBalance:'', newOpeningSide:'dr', newAgentName:'' };
let ledgerSel = { partyId:'', from:'', to:'', view:'ledger' };
let summarySel = { mode:'daily', basis:'billing', date: todayStr(), month: todayStr().slice(0,7) };
let editingPartyId = null;

function todayStr(){ const d=new Date(); return d.toISOString().slice(0,10); }
function blankItem(){ return { product:'', qty:'', unit:'Nos', rate:'' }; }
function agentName(id){ const a = state.agents.find(a=>a.id===id); return a ? a.name : ''; }
function uid(){ return 'id'+Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
function fmt(n){ n = Number(n)||0; return n.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtDate(iso){ if(!iso) return ''; const [y,m,d]=iso.split('-'); return `${d}-${m}-${y}`; }
function fmtMonth(ym){
  if(!ym) return '';
  const [y,m] = ym.split('-');
  const names = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${names[(Number(m)||1)-1] || m} ${y}`;
}

// Works two ways, fully offline either way:
// 1) Inside the Factory Ledger desktop app -> saves to a file on this PC via window.ledgerAPI
// 2) Opened directly as this HTML file in a browser -> saves inside the browser's local storage
async function loadData(){
  try{
    let raw = null;
    if(window.ledgerAPI){ raw = await window.ledgerAPI.getData(); }
    else { raw = localStorage.getItem(STORAGE_KEY); }
    if(raw){
      const parsed = JSON.parse(raw);
      const defaultSettings = state.settings;
      const defaultCounters = defaultSettings.counters;
      state = Object.assign(state, parsed);
      state.settings = Object.assign({}, defaultSettings, parsed.settings || {});
      state.settings.counters = Object.assign({}, defaultCounters, (parsed.settings && parsed.settings.counters) || {});
      if(!Array.isArray(state.parties)) state.parties = [];
      if(!Array.isArray(state.agents)) state.agents = [];
      if(!Array.isArray(state.entries)) state.entries = [];
    }
  }catch(e){ console.error('Load failed', e); }
  loaded = true;
  if(state.lastSeenVersion !== APP_VERSION){ whatsNewOpen = true; }
  render();
}
async function saveData(){
  if(!loaded) return;
  try{
    const json = JSON.stringify(state);
    if(window.ledgerAPI){ await window.ledgerAPI.saveData(json); }
    else { localStorage.setItem(STORAGE_KEY, json); }
  }catch(e){ console.error('Save failed', e); }
}

// ================= COMPUTATIONS =================
function entryTotals(items, cgstRate, sgstRate, gstType, igstRate, packaging, commissionValue, commissionType){
  const itemsSubtotal = items.reduce((s,it)=> s + (Number(it.qty)||0)*(Number(it.rate)||0), 0);
  const pack = Number(packaging)||0;
  const commVal = Number(commissionValue)||0;
  const taxable = itemsSubtotal + pack;
  let cgstAmt=0, sgstAmt=0, igstAmt=0;
  if(gstType==='inter'){
    igstAmt = taxable * (Number(igstRate)||0)/100;
  } else {
    cgstAmt = taxable * (Number(cgstRate)||0)/100;
    sgstAmt = taxable * (Number(sgstRate)||0)/100;
  }
  const comm = commissionType==='percent' ? (taxable * commVal/100) : commVal;
  const raw = taxable + cgstAmt + sgstAmt + igstAmt - comm;
  const total = Math.round(raw);
  const roundoff = total - raw;
  return { subtotal: itemsSubtotal, packaging: pack, commission: comm, commissionValue: commVal, commissionType: commissionType||'amount', taxable, cgstAmt, sgstAmt, igstAmt, raw, total, roundoff };
}
function entryDebit(e){ return (e.type==='sale'||e.type==='payment') ? e.total : 0; }
function entryCredit(e){ return (e.type==='purchase'||e.type==='receipt') ? e.total : 0; }
function partyBalance(partyId){
  const party = state.parties.find(p=>p.id===partyId);
  let bal = party ? (party.openingBalance||0) : 0;
  const list = state.entries.filter(e=>e.partyId===partyId).sort(sortEntries);
  list.forEach(e=>{ bal += entryDebit(e) - entryCredit(e); });
  return bal;
}
function sortEntries(a,b){ if(a.date!==b.date) return a.date<b.date?-1:1; return a.voucherNo - b.voucherNo; }
function totalReceivable(){ return state.parties.filter(p=>p.type==='customer').reduce((s,p)=> s + Math.max(0,partyBalance(p.id)), 0); }
function totalPayable(){ return state.parties.filter(p=>p.type==='supplier').reduce((s,p)=> s + Math.max(0,partyBalance(p.id)), 0); }

function calcIncomeExpense(entries, basis){
  let income = 0, expense = 0;
  entries.forEach(e=>{
    const amt = Number(e.total)||0;
    if(basis === 'cash'){
      if(e.type==='receipt') income += amt;
      else if(e.type==='payment') expense += amt;
    } else {
      if(e.type==='sale') income += amt;
      else if(e.type==='purchase') expense += amt;
    }
  });
  return { income, expense, net: income - expense };
}

function renderIncomeExpenseSection(){
  const mode = summarySel.mode || 'daily';
  const basis = summarySel.basis || 'billing';
  const selKey = mode==='daily' ? summarySel.date : summarySel.month;

  const filteredForCards = selKey
    ? state.entries.filter(e=> mode==='daily' ? e.date===selKey : (e.date||'').slice(0,7)===selKey)
    : state.entries;
  const cardTotals = calcIncomeExpense(filteredForCards, basis);
  const periodLabel = selKey
    ? (mode==='daily' ? fmtDate(selKey) : fmtMonth(selKey))
    : (mode==='daily' ? 'All Days' : 'All Months');

  // Group entries by day or month
  const groups = new Map();
  state.entries.forEach(e=>{
    if(!e.date) return;
    const key = mode==='daily' ? e.date : e.date.slice(0,7);
    if(!groups.has(key)) groups.set(key, []);
    groups.get(key).push(e);
  });
  const sortedKeys = Array.from(groups.keys()).sort((a,b)=> b.localeCompare(a));
  const rowsHtml = sortedKeys.map(k=>{
    const t = calcIncomeExpense(groups.get(k), basis);
    const isSel = selKey && k===selKey;
    return `<tr${isSel?' style="background:var(--gold-soft);font-weight:700;"':''}>
      <td>${escapeHtml(mode==='daily' ? fmtDate(k) : fmtMonth(k))}</td>
      <td class="num credit-col">₹${fmt(t.income)}</td>
      <td class="num debit-col">₹${fmt(t.expense)}</td>
      <td class="num bal-col" style="color:${t.net>=0?'var(--credit)':'var(--debit)'};">₹${fmt(t.net)}</td>
    </tr>`;
  }).join('');

  const incLabel = basis==='cash' ? 'Income (Receipts)' : 'Income (Sales)';
  const expLabel = basis==='cash' ? 'Expenses (Payments)' : 'Expenses (Purchases)';

  return `
    <h2 class="section-title" style="margin-top:20px;">Income &amp; Expenses</h2>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px;">
      <div class="type-picker" style="margin-bottom:0;">
        <div class="type-opt ${mode==='daily'?'active sale':''}" data-set-summary-mode="daily">📅 Every Day</div>
        <div class="type-opt ${mode==='monthly'?'active receipt':''}" data-set-summary-mode="monthly">🗓 Monthly</div>
      </div>
      <div class="type-picker" style="margin-bottom:0;">
        <div class="type-opt ${basis==='billing'?'active sale':''}" data-set-summary-basis="billing">🧾 Sales &amp; Purchases</div>
        <div class="type-opt ${basis==='cash'?'active receipt':''}" data-set-summary-basis="cash">💵 Receipts &amp; Payments</div>
      </div>
      <div class="field" style="flex:0 0 auto;min-width:160px;">
        <label>${mode==='daily'?'Select Date':'Select Month'}</label>
        ${mode==='daily'
          ? `<input type="date" id="summaryDate" value="${summarySel.date}">`
          : `<input type="month" id="summaryMonth" value="${summarySel.month}">`}
      </div>
      ${selKey ? `<button class="btn secondary small" id="summaryClearFilter">Show All</button>` : ''}
    </div>

    <div class="cards" style="margin-bottom:14px;">
      <div class="card payable"><div class="lbl">${incLabel} · ${escapeHtml(periodLabel)}</div><div class="val" style="color:var(--credit);">₹${fmt(cardTotals.income)}</div></div>
      <div class="card receivable"><div class="lbl">${expLabel} · ${escapeHtml(periodLabel)}</div><div class="val" style="color:var(--debit);">₹${fmt(cardTotals.expense)}</div></div>

    </div>

    ${sortedKeys.length===0
      ? `<div class="empty-note">No transactions recorded yet.</div>`

          <table class="ledger">
            <thead><tr><th>${mode==='daily'?'Date':'Month'}</th><th style="width:24%;text-align:right;">${incLabel}</th><th style="width:24%;text-align:right;">${expLabel}</th><th style="width:24%;text-align:right;">Net</th></tr></thead>

  `;

  state.entries.forEach(e=> (e.items||[]).forEach(it=>{

  return Array.from(set).sort((a,b)=>a.localeCompare(b, undefined, {sensitivity:'base'}));
}

function label(t){ return {sale:'Sale',purchase:'Purchase',receipt:'Receipt (Money In)',payment:'Payment (Money Out)'}[t]; }

function buildLedgerRows(sel, includeDeleteBtn){
  const isAll = sel === '__ALL__';
  const party = isAll ? { name: 'All Parties (All Transactions)' } : state.parties.find(p=>p.id===sel);
  const partyNameById = id => ((state.parties.find(p=>p.id===id)||{}).name || 'Unknown Party');
  let list = (isAll ? state.entries.slice() : state.entries.filter(e=>e.partyId===sel)).sort(sortEntries);
  if(ledgerSel.from) list = list.filter(e=> e.date >= ledgerSel.from);
  if(ledgerSel.to) list = list.filter(e=> e.date <= ledgerSel.to);

  let opening = isAll
    ? state.parties.reduce((s,p)=> s + (p.openingBalance||0), 0)
    : (party.openingBalance || 0);
  if(ledgerSel.from){
    state.entries.filter(e=>(isAll || e.partyId===sel) && e.date < ledgerSel.from).sort(sortEntries)
      .forEach(e=>{ opening += entryDebit(e) - entryCredit(e); });
  }
  let bal = opening;
  let totalDebit = 0, totalCredit = 0;
  let rows = `<tr class="entry-head"><td colspan="4"><strong>Old Balance</strong></td><td class="num debit-col"></td><td class="num credit-col"></td><td class="num bal-col">₹${fmt(opening)}</td></tr>`;

  list.forEach(e=>{
    const d = entryDebit(e), c = entryCredit(e);
    bal += d - c; totalDebit += d; totalCredit += c;
    const itemLines = (e.items||[]).map(it=>`<div class="item-line">${escapeHtml(it.product)} — ${it.qty} ${it.unit} × ₹${fmt(it.rate)} = ₹${fmt((Number(it.qty)||0)*(Number(it.rate)||0))}</div>`).join('');
    const gstLines = e.items ? `
      ${e.packaging?`<div class="item-line">Packaging Charges — ₹${fmt(e.packaging)}</div>`:''}
      ${e.cgstAmt?`<div class="item-line">CGST (${e.cgstRate}%) — ₹${fmt(e.cgstAmt)}</div>`:''}
      ${e.sgstAmt?`<div class="item-line">SGST (${e.sgstRate}%) — ₹${fmt(e.sgstAmt)}</div>`:''}
      ${e.igstAmt?`<div class="item-line">IGST (${e.igstRate}%) — ₹${fmt(e.igstAmt)}</div>`:''}
      ${e.commission?`<div class="item-line">Commission Charges${e.commissionType==='percent' ? ' ('+e.commissionValue+'% of taxable)' : ''} — − ₹${fmt(e.commission)}</div>`:''}
      <div class="item-line">Round off — ₹${fmt(e.roundoff)}</div>` : '';
    const particularsTitle = e.type==='sale' ? 'Sales' : e.type==='purchase' ? 'Purchase' : e.type==='receipt' ? `Receipt [${e.mode||'Cash'}]` : `Payment [${e.mode||'Cash'}]`;
    const partyTag = isAll ? ` — ${escapeHtml(partyNameById(e.partyId))}` : '';
    const agentLine = e.agentId ? `<div class="item-line">Agent: ${escapeHtml(agentName(e.agentId))}</div>` : '';
    rows += `<tr class="entry-head">
      <td>${e.voucherNo}</td>
      <td>${fmtDate(e.date)}</td>
      <td colspan="2">
        <div class="particulars-title">${particularsTitle}${partyTag}</div>
        ${agentLine}${itemLines}${gstLines}
        ${e.note?`<div class="item-line">Note: ${escapeHtml(e.note)}</div>`:''}
      </td>
      <td class="num debit-col">${d?('₹'+fmt(d)):''}</td>
      <td class="num credit-col">${c?('₹'+fmt(c)):''}</td>
      <td class="num bal-col">₹${fmt(bal)}</td>
    </tr>`;
    if(includeDeleteBtn){
      rows += `<tr class="no-print"><td colspan="7" style="text-align:right;padding:2px 8px 8px;border-bottom:1px solid var(--rule-blue);">
        <button class="del-x" data-del-entry="${e.id}">Delete entry</button>
      </td></tr>`;
    }
  });

  const grandDebit = totalDebit + (opening>0?opening:0);
  const grandCredit = totalCredit + (opening<0?-opening:0);
  rows += `<tr class="total-row"><td colspan="4">Grand Total</td><td class="num">₹${fmt(grandDebit)}</td><td class="num">₹${fmt(grandCredit)}</td><td class="num"></td></tr>`;
  rows += `<tr class="total-row closing"><td colspan="6">Closing Balance</td><td class="num">₹${fmt(bal)} ${bal>=0?'Dr':'Cr'}</td></tr>`;

  return { rows, party, bal };
}

function buildLedgerTableHtml(sel, includeDeleteBtn){
  const { rows } = buildLedgerRows(sel, includeDeleteBtn);
  return `
    <div class="ledger-wrap">
      <table class="ledger">
        <thead><tr><th style="width:6%">ID</th><th style="width:9%">Date</th><th colspan="2">Particulars</th><th style="width:12%">Debit</th><th style="width:12%">Credit</th><th style="width:12%">Balance</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

function buildDispatchTableHtml(sel){
  const isAll = sel === '__ALL__';
  const partyNameById = id => ((state.parties.find(p=>p.id===id)||{}).name || 'Unknown Party');
  let list = state.entries.filter(e=>(isAll || e.partyId===sel) && e.type==='sale').sort(sortEntries);
  if(ledgerSel.from) list = list.filter(e=> e.date >= ledgerSel.from);
  if(ledgerSel.to) list = list.filter(e=> e.date <= ledgerSel.to);

  let rows = '';
  let serial = 1;
  list.forEach(e=>{
    const ag = e.agentId ? agentName(e.agentId) : '—';
    const pName = partyNameById(e.partyId);
    (e.items||[]).forEach(it=>{
      rows += `<tr>
        <td>${serial++}</td>
        <td>${fmtDate(e.date)}</td>
        <td>${escapeHtml(pName)}</td>
        <td>${escapeHtml(ag || '—')}</td>
        <td>${escapeHtml(it.product)}</td>
        <td class="num">${fmt(it.qty).replace(/\.00$/,'')}</td>
        <td>${escapeHtml(it.unit)}</td>
      </tr>`;
    });
  });
  if(!rows){
    rows = `<tr><td colspan="7" style="text-align:center;color:var(--ink-soft);padding:16px;">No sales found for this party in the selected range.</td></tr>`;
  }
  return `
    <div class="ledger-wrap">
      <table class="ledger">
        <thead><tr><th style="width:6%">#</th><th style="width:10%">Date</th><th style="width:20%">Party</th><th style="width:16%">Agent</th><th>Product</th><th style="width:10%">Qty / Cases</th><th style="width:10%">Unit</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

// ================= HELPERS =================
function escapeHtml(s){ return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }

// ================= PRODUCT DROPDOWN =================
function closeAllProductDrops(exceptIdx){
  document.querySelectorAll('.product-dropdown.open').forEach(el=>{
    if(exceptIdx != null && el.id === 'productDrop-'+exceptIdx) return;
    el.classList.remove('open');
  });
}

function openProductDrop(idx, showAll){
  closeAllProductDrops(idx);
  const drop = document.getElementById('productDrop-'+idx);
  const inp = document.querySelector(`.item-product[data-idx="${idx}"]`);
  if(!drop || !inp) return;
  const all = allKnownProducts();
  const q = showAll ? '' : inp.value.trim().toLowerCase();
  const matches = q ? all.filter(p=>p.toLowerCase().includes(q)) : all;
  if(matches.length===0){ drop.classList.remove('open'); drop.innerHTML=''; return; }
  drop.innerHTML = matches.map((p,i)=>`<div class="product-opt${i===0&&q?' active':''}" data-idx="${idx}" data-pick-product="${escapeAttr(p)}">${escapeHtml(p)}</div>`).join('');
  drop.classList.add('open');
}

function selectProductOption(idx, val){
  if(draft.items[idx]) draft.items[idx].product = val;
  const inp = document.querySelector(`.item-product[data-idx="${idx}"]`);
  if(inp){ inp.value = val; }
  closeAllProductDrops();
}

// ================= EVENT DELEGATION (bound once — survives all re-renders) =================
function initEventDelegation(){
  // Click targets: every button, tab, and data-action element in the app
  const CLICK_SEL = [
    '#printBtn','#settingsBtn','#settingsCloseBtn','#settingsOverlay',
    '#saveSettingsBtn','#resetDataBtn','#checkUpdatesBtn','#installUpdateBtn',
    '#addPartyBtn','#cancelEditPartyBtn','#addAgentBtn',
    '#addItemRow','#saveEntryBtn',
    '#previewPrintBtn','#doPrintBtn','#waShareBtn','#closePreviewBtn',
    '#whatsNewBtn','#whatsNewLinkBtn','#whatsNewCloseBtn','#whatsNewCloseX','#whatsNewOverlay',
    '[data-tab]','[data-set-type]','[data-set-gsttype]','[data-set-view]',
    '[data-set-summary-mode]','[data-set-summary-basis]','#summaryClearFilter',
    '[data-edit-party]','[data-del-party]','[data-open-ledger]','[data-del-agent]',
    '[data-rm-item]','[data-del-entry]','[data-drop-idx]'
  ].join(',');

  document.addEventListener('click', function(e){
    const el = e.target.closest(CLICK_SEL);
    if(!el) return;
    const id = el.id, ds = el.dataset;

    // ---- Header ----
    if(id==='printBtn'){ currentTab='ledger'; if(ledgerSel.partyId){ printPreviewOpen=true; } render(); return; }
    if(id==='settingsBtn'){ settingsOpen=true; render(); return; }
    if(id==='whatsNewBtn' || id==='whatsNewLinkBtn'){ whatsNewOpen=true; render(); return; }
    if(id==='whatsNewCloseBtn' || id==='whatsNewCloseX' || id==='whatsNewOverlay'){
      whatsNewOpen=false; state.lastSeenVersion=APP_VERSION; saveData(); render(); return;
    }

    // ---- Settings panel ----
    if(id==='settingsCloseBtn'||id==='settingsOverlay'){ settingsOpen=false; render(); return; }
    if(id==='saveSettingsBtn'){
      const gv = function(eid){ const e=document.getElementById(eid); return e ? e.value : ''; };
      state.settings.address  = gv('setAddress');
      state.settings.gstin    = gv('setGstin');
      state.settings.cgstRate = Number(gv('setCgst'))||0;
      state.settings.sgstRate = Number(gv('setSgst'))||0;
      state.settings.igstRate = Number(gv('setIgst'))||0;
      draft.cgstRate=state.settings.cgstRate; draft.sgstRate=state.settings.sgstRate; draft.igstRate=state.settings.igstRate;
      saveData(); settingsOpen=false; render(); return;
    }
    if(id==='resetDataBtn'){
      if(confirm('This will permanently delete all parties and entries. Continue?')){
        state={ settings:{ companyName:state.settings.companyName, address:'', gstin:'', cgstRate:2.5, sgstRate:2.5, igstRate:5, counters:{sale:1,purchase:1,receipt:1,payment:1} }, parties:[], agents:[], entries:[], lastSeenVersion: APP_VERSION };
        saveData(); settingsOpen=false; render();
      }
      return;
    }
    if(id==='checkUpdatesBtn' && window.ledgerAPI && window.ledgerAPI.checkUpdates){
      updateState = { status:'checking', version:'' };
      render();
      window.ledgerAPI.checkUpdates().then(res=>{
        if(res && !res.ok){ updateState = { status: res.reason || 'offline', version:'' }; render(); }
      });
      return;
    }
    if(id==='installUpdateBtn' && window.ledgerAPI && window.ledgerAPI.installUpdate){
      window.ledgerAPI.installUpdate();
      return;
    }

    // ---- Tabs ----
    if(ds.tab){ currentTab=ds.tab; render(); return; }

    // ---- Parties ----
    if(id==='addPartyBtn'){
      const name = draft.newPartyName.trim();
      if(!name){ showToast('⚠️ Please enter a party name.'); return; }
      const obAmt = Math.abs(Number(draft.newOpeningBalance)||0);
      const openingBalance = draft.newOpeningSide==='cr' ? -obAmt : obAmt;
      if(editingPartyId){
        const p=state.parties.find(p=>p.id===editingPartyId);
        p.name=name; p.type=draft.newPartyType; p.openingBalance=openingBalance;
        editingPartyId=null;
      } else {
        state.parties.push({ id:uid(), name, type:draft.newPartyType, openingBalance });
      }
      draft.newPartyName=''; draft.newOpeningBalance=''; draft.newOpeningSide='dr';
      saveData(); render(); return;
    }
    if(id==='cancelEditPartyBtn'){
      editingPartyId=null; draft.newPartyName=''; draft.newOpeningBalance=''; draft.newOpeningSide='dr'; render(); return;
    }
    if(ds.editParty){
      const p=state.parties.find(p=>p.id===ds.editParty); if(!p) return;
      editingPartyId=p.id; draft.newPartyName=p.name; draft.newPartyType=p.type;
      draft.newOpeningBalance=Math.abs(p.openingBalance||0)||'';
      draft.newOpeningSide=(p.openingBalance||0)<0?'cr':'dr';
      render(); return;
    }
    if(ds.delParty){
      if(confirm('Delete this party and all their entries?')){
        state.parties=state.parties.filter(p=>p.id!==ds.delParty);
        state.entries=state.entries.filter(en=>en.partyId!==ds.delParty);
        saveData(); render();
      }
      return;
    }
    if(ds.openLedger){
      ledgerSel.partyId=ds.openLedger; ledgerSel.from=''; ledgerSel.to='';
      currentTab='ledger'; render(); return;
    }

    // ---- Agents ----
    if(id==='addAgentBtn'){
      const name = draft.newAgentName.trim();
      if(!name){ showToast('⚠️ Please enter an agent name.'); return; }
      state.agents.push({ id: uid(), name });
      draft.newAgentName='';
      saveData(); render(); return;
    }
    if(ds.delAgent){
      if(confirm('Delete this agent? Past entries keep the agent name, only the selectable list changes.')){
        state.agents = state.agents.filter(a=>a.id!==ds.delAgent);
        saveData(); render();
      }
      return;
    }

    // ---- New Entry ----
    if(ds.setType){ draft.type=ds.setType; draft.partyId=''; render(); return; }
    if(id==='addItemRow'){ draft.items.push(blankItem()); render(); return; }
    if(ds.rmItem){ draft.items.splice(Number(ds.rmItem),1); render(); return; }
    if(ds.dropIdx != null){
      const idx = Number(ds.dropIdx);
      const drop = document.getElementById('productDrop-'+idx);
      const isOpen = drop && drop.classList.contains('open');
      if(isOpen){ closeAllProductDrops(); }
      else {
        const inp = document.querySelector(`.item-product[data-idx="${idx}"]`);
        if(inp) inp.focus();
        openProductDrop(idx, true);
      }
      return;
    }
    if(ds.setGsttype){ draft.gstType=ds.setGsttype; render(); return; }
    if(id==='saveEntryBtn'){ saveEntry(); return; }

    // ---- Dashboard Income & Expenses ----
    if(ds.setSummaryMode){ summarySel.mode=ds.setSummaryMode; render(); return; }
    if(ds.setSummaryBasis){ summarySel.basis=ds.setSummaryBasis; render(); return; }
    if(id==='summaryClearFilter'){
      if(summarySel.mode==='daily') summarySel.date=''; else summarySel.month='';
      render(); return;
    }

    // ---- Ledger ----
    if(id==='previewPrintBtn'){ if(!ledgerSel.partyId) return; printPreviewOpen=true; render(); return; }
    if(ds.setView){ ledgerSel.view=ds.setView; render(); return; }

    // ---- Print preview ----
    if(id==='doPrintBtn'){ window.print(); return; }
    if(id==='waShareBtn'){ shareToWhatsApp(); return; }
    if(id==='closePreviewBtn'){ printPreviewOpen=false; render(); return; }

    // ---- Entry delete ----
    if(ds.delEntry){
      if(confirm('Delete this entry? This cannot be undone.')){
        state.entries=state.entries.filter(en=>en.id!==ds.delEntry);
        saveData(); render();
      }
    }
  });

  // Input events — update draft state live; no re-render needed (only totals update)
  document.addEventListener('input', function(e){
    const t=e.target, id=t.id, ds=t.dataset;
    if(id==='newPartyName')     { draft.newPartyName=t.value; return; }
    if(id==='newAgentName')     { draft.newAgentName=t.value; return; }
    if(id==='newOpeningBalance'){ draft.newOpeningBalance=t.value; return; }
    if(id==='amountInput')      { draft.amount=t.value; return; }
    if(id==='noteInput')        { draft.note=t.value; return; }
    if(id==='packagingInput')   { draft.packaging=t.value; updateTotalsBox(); return; }
    if(id==='commissionInput')  { draft.commission=t.value; updateTotalsBox(); return; }
    if(id==='cgstRate')         { draft.cgstRate=t.value; updateTotalsBox(); return; }
    if(id==='sgstRate')         { draft.sgstRate=t.value; updateTotalsBox(); return; }
    if(id==='igstRate')         { draft.igstRate=t.value; updateTotalsBox(); return; }
    const idx = ds.idx != null ? Number(ds.idx) : -1;
    if(idx >= 0 && t.classList.contains('item-product')){ if(draft.items[idx]) draft.items[idx].product=t.value; openProductDrop(idx, false); return; }
    if(idx >= 0 && t.classList.contains('item-qty'))    { if(draft.items[idx]) draft.items[idx].qty=t.value; updateLineAndTotals(ds.idx); return; }
    if(idx >= 0 && t.classList.contains('item-rate'))   { if(draft.items[idx]) draft.items[idx].rate=t.value; updateLineAndTotals(ds.idx); return; }
  });

  // Change events — for selects, checkboxes, and date pickers
  document.addEventListener('change', function(e){
    const t=e.target, id=t.id, ds=t.dataset;
    if(id==='companyNameInput') { state.settings.companyName=t.value; saveData(); return; }
    if(id==='newPartyType')     { draft.newPartyType=t.value; return; }
    if(id==='newOpeningSide')   { draft.newOpeningSide=t.value; return; }
    if(id==='partySelect')      { draft.partyId=t.value; return; }
    if(id==='agentSelect')      { draft.agentId=t.value; return; }
    if(id==='entryDate')        { draft.date=t.value; return; }
    if(id==='modeSelect')       { draft.mode=t.value; return; }
    if(id==='ledgerPartySelect'){ ledgerSel.partyId=t.value; render(); return; }
    if(id==='ledgerFrom')       { ledgerSel.from=t.value; render(); return; }
    if(id==='ledgerTo')         { ledgerSel.to=t.value; render(); return; }
    if(id==='summaryDate')      { summarySel.date=t.value; render(); return; }
    if(id==='summaryMonth')     { summarySel.month=t.value; render(); return; }
    if(id==='commissionType'){ draft.commissionType=t.value; updateTotalsBox(); return; }
    if(id==='bwToggle'){
      printBw=t.checked;
      const paper=document.getElementById('printPaper');
      if(paper) paper.classList.toggle('bw-mode',printBw);
      return;
    }
    const idx = ds.idx != null ? Number(ds.idx) : -1;
    if(idx >= 0 && t.classList.contains('item-unit')){ if(draft.items[idx]) draft.items[idx].unit=t.value; }
  });

  // Product dropdown: open on focus, pick on mousedown, navigate with keyboard, close on outside click
  document.addEventListener('focusin', function(e){
    const t = e.target;
    if(t.classList && t.classList.contains('item-product')){
      const idx = Number(t.dataset.idx);
      if(!Number.isNaN(idx)) openProductDrop(idx, false);
    } else if(!t.closest || !t.closest('.product-combo')){
      closeAllProductDrops();
    }
  });

  document.addEventListener('mousedown', function(e){
    const opt = e.target.closest('.product-opt');
    if(opt){
      e.preventDefault();
      selectProductOption(Number(opt.dataset.idx), opt.dataset.pickProduct);
      return;
    }
    if(!e.target.closest('.product-combo')){
      closeAllProductDrops();
    }
  });

  document.addEventListener('keydown', function(e){
    const t = e.target;
    if(!t.classList || !t.classList.contains('item-product')) return;
    const idx = Number(t.dataset.idx);
    const drop = document.getElementById('productDrop-'+idx);
    if(!drop || !drop.classList.contains('open')) return;
    const opts = Array.from(drop.querySelectorAll('.product-opt'));
    if(opts.length===0) return;
    let cur = opts.findIndex(o=>o.classList.contains('active'));
    if(e.key==='ArrowDown'){
      e.preventDefault();
      if(cur>=0) opts[cur].classList.remove('active');
      cur = (cur + 1) % opts.length;
      opts[cur].classList.add('active');
      opts[cur].scrollIntoView({block:'nearest'});
    } else if(e.key==='ArrowUp'){
      e.preventDefault();
      if(cur>=0) opts[cur].classList.remove('active');
      cur = cur <= 0 ? opts.length - 1 : cur - 1;
      opts[cur].classList.add('active');
      opts[cur].scrollIntoView({block:'nearest'});
    } else if(e.key==='Enter' && cur>=0){
      e.preventDefault();
      selectProductOption(idx, opts[cur].dataset.pickProduct);
    } else if(e.key==='Escape'){
      closeAllProductDrops();
    }
  });
}

// ================= WHATSAPP SHARE =================
function showToast(msg, durationMs){
  const t = document.getElementById('shareToast');
  if(!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=> t.classList.remove('show'), durationMs || 3200);
}

async function shareToWhatsApp(){
  const btn = document.getElementById('waShareBtn');
  const paper = document.getElementById('printPaper');
  if(!paper){ showToast('⚠️ Nothing to share — open a ledger preview first.'); return; }

  if(typeof html2canvas === 'undefined' || typeof jspdf === 'undefined'){
    showToast('⏳ PDF libraries still loading — please try again in a moment.');
    return;
  }

  if(btn){ btn.disabled = true; btn.textContent = '⏳ Generating PDF…'; }
  showToast('⏳ Building PDF, please wait…', 30000);

  try{
    // 1. Render paper to canvas
    const canvas = await html2canvas(paper, {
      scale: 2, useCORS: true,
      backgroundColor: paper.classList.contains('bw-mode') ? '#ffffff' : '#fffdf6',
      logging: false
    });

    // 2. Build PDF
    const { jsPDF } = jspdf;
    const imgData = canvas.toDataURL('image/jpeg', 0.92);
    const pxW = canvas.width, pxH = canvas.height;
    const mmW = 210, mmH = (pxH / pxW) * mmW;
    const pdf = new jsPDF({ orientation: mmH > mmW ? 'portrait' : 'landscape', unit: 'mm', format: [mmW, mmH] });
    pdf.addImage(imgData, 'JPEG', 0, 0, mmW, mmH);
    const pdfBlob = pdf.output('blob');

    const sel = ledgerSel.partyId;
    const party = (sel && sel !== '__ALL__') ? state.parties.find(p=>p.id===sel) : null;
    const partySlug = sel === '__ALL__' ? 'All_Parties' : (party ? party.name.replace(/[^a-zA-Z0-9]+/g,'_').slice(0,30) : 'Ledger');
    const dateSlug = new Date().toISOString().slice(0,10);
    const fileName = `Ledger_${partySlug}_${dateSlug}.pdf`;
    const pdfFile = new File([pdfBlob], fileName, { type:'application/pdf' });

    // 3a. Web Share API — ONLY on mobile browsers (not Electron/desktop)
    //     The Windows OS share dialog doesn't surface WhatsApp, so we skip it there.
    const isElectron = !!(window.ledgerAPI); // Electron exposes ledgerAPI via preload
    const isMobile   = /Android|iPhone|iPad/i.test(navigator.userAgent);
    const canWebShare = !isElectron && isMobile && navigator.canShare && navigator.canShare({ files:[pdfFile] });

    if(canWebShare){
      try{
        await navigator.share({
          files: [pdfFile],
          title: fileName.replace(/_/g,' ').replace('.pdf',''),
          text:  'Ledger report from Factory Ledger'
        });
        showToast('✅ Share sheet opened — pick WhatsApp to send!');
        return;
      } catch(shareErr){
        if(shareErr.name === 'AbortError'){ showToast('Share cancelled.'); return; }
        // otherwise fall through to download fallback
      }
    }

    // 3b. Universal fallback: show modal with a Download button (no auto-download)
    showWaModal(fileName, pdfBlob);
    showToast(''); // hide the building-PDF toast immediately

  } catch(err){
    console.error('WhatsApp share error:', err);
    showToast('❌ Could not generate PDF: ' + (err.message || err));
  } finally{
    if(btn){ btn.disabled = false; btn.textContent = '📤 Share to WhatsApp'; }
  }
}

function showWaModal(fileName, pdfBlob){
  const modal      = document.getElementById('waModal');
  const nameEl     = document.getElementById('waModalFilename');
  const descEl     = document.getElementById('waModalDesc');
  const noteEl     = document.getElementById('waModalNote');
  const desktopBtn = document.getElementById('waOpenDesktop');
  const webBtn     = document.getElementById('waOpenWA');
  const dlBtn      = document.getElementById('waDownloadPdf');
  const closeBtn   = document.getElementById('waModalClose');
  if(!modal) return;

  if(nameEl) nameEl.textContent = '📄 ' + fileName;
  modal.classList.add('open');

  const isElectron = !!(window.ledgerAPI && window.ledgerAPI.openExternal);

  // Clone buttons to remove any previous listeners
  function freshBtn(el){
    const clone = el.cloneNode(true);
    el.parentNode.replaceChild(clone, el);
    return clone;
  }
  const dBtn = freshBtn(desktopBtn);
  const wBtn = freshBtn(webBtn);
  const dlB = freshBtn(dlBtn);
  const cBtn = freshBtn(closeBtn);

  cBtn.addEventListener('click', ()=> modal.classList.remove('open'));
  modal.onclick = e => { if(e.target === modal) modal.classList.remove('open'); };
  wBtn.addEventListener('click', ()=> window.open('https://web.whatsapp.com','_blank','noopener'));

  // Download PDF button — only triggers download on explicit click
  if(pdfBlob){
    dlB.style.display = '';
    dlB.addEventListener('click', ()=>{
      const objUrl = URL.createObjectURL(pdfBlob);
      const a = document.createElement('a');
      a.href = objUrl; a.download = fileName;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(()=> URL.revokeObjectURL(objUrl), 60000);
      dlB.textContent = '✅ Downloaded!';
      setTimeout(()=>{ dlB.textContent = '⬇️ Download PDF'; }, 2500);
    });
  } else {
    dlB.style.display = 'none';
  }

  if(isElectron){
    // Show the Desktop button; try whatsapp:// URI scheme on click
    dBtn.style.display = '';
    wBtn.style.display = 'none';   // hide Web until desktop fails
    if(descEl) descEl.innerHTML = 'PDF saved to <strong>Downloads</strong>. Click below to open WhatsApp Desktop and attach the file.';
    if(noteEl) noteEl.style.display = 'none';

    dBtn.addEventListener('click', async ()=>{
      dBtn.disabled = true;
      dBtn.textContent = '⏳ Opening…';
      const ok = await window.ledgerAPI.openExternal('whatsapp://');
      dBtn.disabled = false;
      dBtn.textContent = 'Open WhatsApp →';
      if(!ok){
        // WhatsApp Desktop not installed — surface the web fallback
        dBtn.style.display = 'none';
        wBtn.style.display = '';
        if(noteEl){
          noteEl.textContent = 'WhatsApp Desktop not found. Use WhatsApp Web instead.';
          noteEl.style.display = 'block';
        }
      }
    });
  } else {
    // Browser / non-Electron: show BOTH Desktop and Web buttons
    // The whatsapp:// URI scheme works in browsers too if WhatsApp Desktop is installed
    dBtn.style.display = '';
    wBtn.style.display = '';
    if(descEl) descEl.innerHTML = 'PDF saved to <strong>Downloads</strong>. Open WhatsApp and attach the file to any chat.';

    dBtn.addEventListener('click', ()=>{
      // Open WhatsApp Desktop via URI scheme (works if installed)
      window.location.href = 'whatsapp://';
    });
  }
}

function updateLineAndTotals(idxStr){
  const idx = Number(idxStr);
  const it = draft.items[idx];
  const amtCell = document.getElementById('amt-'+idx);
  if(amtCell) amtCell.textContent = '₹'+fmt((Number(it.qty)||0)*(Number(it.rate)||0));
  updateTotalsBox();
}
function updateTotalsBox(){
  const t = entryTotals(draft.items, draft.cgstRate, draft.sgstRate, draft.gstType, draft.igstRate, draft.packaging, draft.commission, draft.commissionType);
  const set = (id,val)=>{ const el=document.getElementById(id); if(el) el.textContent = '₹'+fmt(val); };
  set('tb-subtotal', t.subtotal); set('tb-packaging', t.packaging); set('tb-taxable', t.taxable);
  set('tb-cgst', t.cgstAmt); set('tb-sgst', t.sgstAmt); set('tb-igst', t.igstAmt);
  const commEl = document.getElementById('tb-commission'); if(commEl) commEl.textContent = '− ₹'+fmt(t.commission);
  const commLabelEl = document.getElementById('tb-commission-label');
  if(commLabelEl) commLabelEl.textContent = (draft.commissionType==='percent' && draft.commission) ? `Commission (${draft.commission}% deducted)` : 'Commission (deducted)';
  set('tb-round', t.roundoff); set('tb-total', t.total);
}

function saveEntry(){
  if(!draft.partyId){ showToast('⚠️ Please select a party.'); return; }
  if(!draft.date){ showToast('⚠️ Please pick a date.'); return; }

  const isItemsType = draft.type==='sale' || draft.type==='purchase';
  let entry = { id: uid(), type: draft.type, partyId: draft.partyId, agentId: draft.agentId||'', date: draft.date, note: draft.note };

  if(isItemsType){
    const items = draft.items
      .map(it=>({ product: it.product.trim(), qty: Number(it.qty)||0, unit: it.unit, rate: Number(it.rate)||0 }))
      .filter(it=> it.product && it.qty>0 && it.rate>=0);
    if(items.length===0){ showToast('⚠️ Add at least one product line with quantity and rate.'); return; }
    const t = entryTotals(items, Number(draft.cgstRate)||0, Number(draft.sgstRate)||0, draft.gstType, Number(draft.igstRate)||0, draft.packaging, draft.commission, draft.commissionType);
    entry.items = items;
    entry.gstType = draft.gstType;
    entry.cgstRate = draft.gstType==='intra' ? (Number(draft.cgstRate)||0) : 0;
    entry.sgstRate = draft.gstType==='intra' ? (Number(draft.sgstRate)||0) : 0;
    entry.igstRate = draft.gstType==='inter' ? (Number(draft.igstRate)||0) : 0;
    entry.subtotal = t.subtotal; entry.packaging = t.packaging; entry.taxable = t.taxable;
    entry.cgstAmt = t.cgstAmt; entry.sgstAmt = t.sgstAmt; entry.igstAmt = t.igstAmt;
    entry.commission = t.commission;
    entry.commissionType = t.commissionType;
    entry.commissionValue = t.commissionValue;
    entry.roundoff = t.roundoff; entry.total = t.total;
    entry.voucherNo = state.settings.counters[draft.type]++;
  } else {
    const amt = Number(draft.amount)||0;
    if(amt<=0){ showToast('⚠️ Please enter a valid amount.'); return; }
    entry.total = Math.round(amt*100)/100;
    entry.mode = draft.mode;
    entry.voucherNo = state.settings.counters[draft.type]++;
  }

  state.entries.push(entry);
  saveData();

  // reset draft but keep type/party for fast repeated entry
  draft.items = [blankItem()];
  draft.amount = ''; draft.note = ''; draft.packaging=''; draft.commission=''; draft.commissionType='amount';
  showToast('✅ Entry saved — ready for the next one.');
  render();
  // put the cursor straight back into the first field so typing can continue immediately
  setTimeout(()=>{
    const next = isItemsType
      ? document.querySelector('.item-product[data-idx="0"]')
      : document.getElementById('amountInput');
    if(next) next.focus();
  }, 0);
}

// init
draft.cgstRate = state.settings.cgstRate;
draft.sgstRate = state.settings.sgstRate;
initEventDelegation(); // bound once — never needs to run again after re-renders
if(window.ledgerAPI && window.ledgerAPI.onUpdateStatus){
  window.ledgerAPI.onUpdateStatus((data)=>{
    updateState = data || { status:'', version:'' };
    if(updateState.status==='downloaded'){
      showToast(`✅ Update v${updateState.version||''} ready — open Settings to restart & update.`, 5000);
    }
    if(settingsOpen) render();
  });
}
loadData();
